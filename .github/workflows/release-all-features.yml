# Builds the all-features fork of Rill and publishes a multi-arch Docker image to GHCR.
# Runs on every push to avaitla/all-features (moving `all-features` tag),
# on tags matching all-features-v* (versioned image tag + GitHub Release with the
# linux binaries attached), and manually via workflow_dispatch.
# Uses only the built-in GITHUB_TOKEN; no external secrets required.

name: Release all-features to GHCR

on:
  push:
    branches:
      - avaitla/all-features
      - avaitla/all-features-experimental
    tags:
      - "all-features-v*"
      - "all-features-experimental-v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rill

jobs:
  build:
    name: Build linux_${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build and embed static UI
        run: make cli.prepare
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build rill binary
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="all-features-$(git rev-parse --short HEAD)"
          fi

          go build -o rill \
            -mod=readonly \
            -ldflags="-s -w -X main.Version=${VERSION} -X main.Commit=${{ github.sha }} -X main.BuildDate=$(date +%FT%TZ)" \
            cli/main.go

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: rill_linux_${{ matrix.arch }}
          path: rill
          if-no-files-found: error

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile only needs the rill binary, so build from a minimal
      # context dir instead of the repo root (which contains node_modules
      # after cli.prepare and would make the build context enormous).
      - name: Build and push per-arch image
        run: |
          mkdir -p .docker-ctx
          cp Dockerfile rill .docker-ctx/
          docker build -t "${IMAGE}:sha-${GITHUB_SHA::7}-${{ matrix.arch }}" .docker-ctx
          docker push "${IMAGE}:sha-${GITHUB_SHA::7}-${{ matrix.arch }}"

  publish:
    name: Publish multi-arch manifest
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          # Derive the moving image tag from the branch name (strip the "avaitla/" prefix):
          # avaitla/all-features -> all-features, avaitla/all-features-experimental -> all-features-experimental.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BASE_TAG="all-features"
            [[ "${GITHUB_REF_NAME}" == all-features-experimental-* ]] && BASE_TAG="all-features-experimental"
          else
            BASE_TAG="${GITHUB_REF_NAME##*/}"
          fi

          TAGS=("${BASE_TAG}" "sha-${GITHUB_SHA::7}")
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAGS+=("${GITHUB_REF_NAME}")
          fi

          ARGS=()
          for t in "${TAGS[@]}"; do ARGS+=(-t "${IMAGE}:${t}"); done

          docker buildx imagetools create "${ARGS[@]}" \
            "${IMAGE}:sha-${GITHUB_SHA::7}-amd64" \
            "${IMAGE}:sha-${GITHUB_SHA::7}-arm64"

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/all-features-v')
    runs-on: ubuntu-22.04
    needs: publish

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact layout
        run: |
          mkdir -p out
          for d in dist/*/; do
            name=$(basename "$d")
            cp "$d/rill" "out/${name}"
          done
          ls -la out

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            Multi-arch Docker image (linux/amd64 + linux/arm64):

            ```
            docker pull ghcr.io/${{ github.repository_owner }}/rill:${{ github.ref_name }}
            docker run --rm -p 9009:9009 -v "$PWD:/project" -w /project \
              ghcr.io/${{ github.repository_owner }}/rill:${{ github.ref_name }} start --no-open --port 9009
            ```
