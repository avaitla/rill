# The "grouped sections" answer: a canvas composes MULTIPLE metrics views —
# HTTP metrics come from the `http_requests` table, resource metrics from the
# `instance_resources` table (in real life: different CloudWatch exports).
# Markdown rows act as section headers, exactly like Grafana dashboard rows.
type: canvas
display_name: "4 · Ops overview (sectioned canvas, two metrics views)"
defaults:
  time_range: PT6H

rows:
  - items:
      - markdown:
          content: "## HTTP traffic — `http_requests_after` metrics view"
        width: 12
    height: 60px
  - items:
      - kpi_grid:
          metrics_view: http_requests_after
          measures:
            - requests
            - error_rate
            - not_found_rate
        width: 12
    height: 200px
  - items:
      - line_chart:
          metrics_view: http_requests_after
          x:
            field: time
            type: temporal
          y:
            field: requests
            type: quantitative
          color:
            field: job
            type: nominal
        width: 6
      - line_chart:
          metrics_view: http_requests_after
          x:
            field: time
            type: temporal
          y:
            field: error_rate
            type: quantitative
          color:
            field: job
            type: nominal
        width: 6
    height: 320px
  - items:
      - markdown:
          content: "## Instance resources — `instance_resources` metrics view (different table)"
        width: 12
    height: 60px
  - items:
      - kpi_grid:
          metrics_view: instance_resources
          measures:
            - cpu_pct
            - unused_memory_mib
            - running_instances
        width: 12
    height: 200px
  - items:
      - leaderboard:
          metrics_view: instance_resources
          measures:
            - cpu_pct
            - unused_memory_mib
          dimensions:
            - instance
            - app
          num_rows: 7
        width: 12
    height: 348px
