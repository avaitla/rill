# A metrics view DIRECTLY on the narrow CloudWatch format — no pivot model needed:
#   - `map_column: dimensions` discovers the dynamic labels (DBInstanceIdentifier,
#     env, region) at reconcile time and expands them into real dimensions.
#   - Measures implement the summary-struct re-aggregation algebra from the draft's §8:
#     avg = sum(value.sum) / sum(value.count)  — NEVER avg of avgs
#     max = max(value.max), min = min(value.min)
#   - Thresholds carry over unchanged from the wide-table variant.
version: 1
type: metrics_view

display_name: RDS via CloudWatch stream (narrow format)
model: cloudwatch_rds
timeseries: time
smallest_time_grain: minute

dimensions:
  - name: metric_name
    display_name: Metric
    column: metric_name
  - map_column: dimensions

measures:
  - name: cpu_avg
    display_name: CPU % (avg)
    expression: >
      sum(CASE WHEN metric_name = 'CPUUtilization' THEN value.sum END)
      / NULLIF(sum(CASE WHEN metric_name = 'CPUUtilization' THEN value.count END), 0)
    format_d3: ".1f"
    lower_is_better: true
    thresholds:
      - warn: 60
      - critical: 85
  - name: cpu_max
    display_name: CPU % (max)
    expression: max(CASE WHEN metric_name = 'CPUUtilization' THEN value.max END)
    format_d3: ".1f"
    lower_is_better: true
    thresholds:
      - warn: 80
      - critical: 95
  - name: free_storage_min_gb
    display_name: Free storage min (GB)
    expression: min(CASE WHEN metric_name = 'FreeStorageSpace' THEN value.min END)
    format_d3: ",.0f"
    thresholds:
      below: true
      steps:
        - warn: 250
        - critical: 150
  - name: connections_max
    display_name: Connections (max)
    expression: max(CASE WHEN metric_name = 'DatabaseConnections' THEN value.max END)
    format_preset: humanize
    lower_is_better: true
    thresholds:
      - warn: 500
      - critical: 1000
