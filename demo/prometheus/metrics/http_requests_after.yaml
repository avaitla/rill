# AFTER: the same raw cumulative counter table, declared with `kind: counter`.
# The parser GENERATES the reset-safe per-series normalization model
# (`http_requests_after__normalized`) and points this metrics view at it —
# nobody writes window SQL by hand (compare models/http_requests.sql, the manual
# recipe this replaces). Everything downstream is correct under every slice:
#   - `requests` / `qps` sum the normalized increases (qps is grain-stable via unit: per_second)
#   - the rate measures reference the same normalized column, so ratios are exact
#   - thresholds are declared once and color every surface
version: 1
type: metrics_view

display_name: "HTTP — AFTER (kind: counter + thresholds)"
model: http_requests_raw
timeseries: time
smallest_time_grain: minute

dimensions:
  - name: job
    display_name: Job
    column: job
  - name: instance
    display_name: Instance
    column: instance
  - name: handler
    display_name: Handler
    column: handler
  - name: status
    display_name: Status
    column: status

measures:
  - name: requests
    display_name: Requests
    kind: counter
    column: value
    description: Correct request count for any slice — normalization is generated, not hand-written.
    format_preset: humanize
  - name: qps
    display_name: Requests/sec
    kind: counter
    column: value
    unit: per_second
    description: True rate — reads the same at every time grain.
    format_d3: ".2f"
  - name: error_rate
    display_name: 5xx error rate
    expression: sum(CASE WHEN status = '500' THEN value ELSE 0 END) / NULLIF(sum(value), 0)
    description: Ratio over the normalized increases (the generated model rewrote `value` in place).
    format_preset: percentage
    lower_is_better: true
    thresholds:
      - warn: 0.02
      - critical: 0.05
  - name: not_found_rate
    display_name: 404 rate
    expression: sum(CASE WHEN status = '404' THEN value ELSE 0 END) / NULLIF(sum(value), 0)
    format_preset: percentage
    lower_is_better: true
    thresholds:
      - warn: 0.05
      - critical: 0.10
