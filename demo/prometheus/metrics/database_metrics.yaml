# The RDS-fleet metrics view: cpu / memory / network / disk / connections / replica lag,
# one wide gauge table, one metrics view. Note the threshold directions:
# free storage is bad LOW (below: true), everything else is bad HIGH.
# Every color on every dashboard over this view derives from these declarations —
# the tile, the leaderboard, and (eventually) the alert can never disagree.
version: 1
type: metrics_view

display_name: Database fleet
table: database_metrics
timeseries: time
smallest_time_grain: minute

# table_options: same schema, different table — a selector in the dashboard (and a
# `table=` URL param) switches the whole metrics view between prod and staging fleets.
table_options:
  - database_metrics_staging

# annotations: deploy markers rendered on every measure chart (upstream feature, declared
# once at the semantic layer). The latest deploy lands right before the connection storm.
annotations:
  - model: deploy_events

dimensions:
  - name: database
    display_name: Database
    column: database
    # Dimension value links: an external URL template and a drill-through explore.
    # Drill-through carries the current filters, time range, and grain along.
    links:
      - label: Runbook
        url: "https://runbooks.example.com/db/{{ value }}"
      - label: Inspect database
        explore: db_inspect
  - name: engine
    display_name: Engine
    column: engine
  - name: region
    display_name: Region
    column: region
  - name: workload
    display_name: Workload
    column: workload

measures:
  - name: cpu_pct
    display_name: CPU %
    kind: gauge
    column: cpu_pct
    format_d3: ".1f"
    lower_is_better: true
    thresholds:
      - warn: 60
      - critical: 85
  - name: memory_used_pct
    display_name: Memory used %
    kind: gauge
    column: memory_used_pct
    format_d3: ".1f"
    lower_is_better: true
    thresholds:
      - warn: 80
      - critical: 92
  - name: network_mbps
    display_name: Network MB/s
    kind: gauge
    column: network_mbps
    format_d3: ".1f"
  - name: free_storage_gb
    display_name: Free storage (GB)
    kind: gauge
    expression: min(free_storage_gb)
    format_d3: ",.0f"
    thresholds:
      below: true
      steps:
        - warn: 250
        - critical: 150
  - name: connections
    display_name: Connections
    kind: gauge
    expression: max(connections)
    format_preset: humanize
    lower_is_better: true
    thresholds:
      - warn: 500
      - critical: 1000
  - name: replica_lag_s
    display_name: Replica lag (s)
    kind: gauge
    expression: max(replica_lag_s)
    format_d3: ",.0f"
    lower_is_better: true
    thresholds:
      - warn: 30
      - critical: 120
